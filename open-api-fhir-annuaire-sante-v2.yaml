  /Organization:
    get:
      tags: [ Organization ]
      summary: Rechercher des structures
      description: |
        Recherche de ressources `Organization` (établissements, cabinets, entités légales
        ou géographiques). Permet la navigation hiérarchique via `partof` / `_include` et
        le chaînage vers `PractitionerRole`, `HealthcareService`, `Device` via
        `_revinclude`.

        **Workflow type « annuaire de centre de santé »** — reconstituer l'annuaire
        complet d'un centre de santé et ses BAL MSS (filtrer d'abord `Organization` par
        secteur d'activité + `mailbox-mss`, puis chaîner vers `PractitionerRole` et
        `Practitioner`) :
        1. `Organization` filtrée par secteur d'activité + `mailbox-mss`.
        2. `_revinclude=PractitionerRole:organization` pour obtenir les situations
           d'exercice liées.
        3. Extraction des identifiants de `Practitioner` référencés par ces
           `PractitionerRole`.
        4. `Practitioner` avec `mailbox-mss` pour obtenir les BAL personnelles.
      operationId: searchOrganization
      parameters:
        - $ref: '#/components/parameters/searchId'
        - $ref: '#/components/parameters/organizationIdentifier'
        - $ref: '#/components/parameters/organizationIdentifierType'
        - $ref: '#/components/parameters/organizationName'
        - $ref: '#/components/parameters/organizationActive'
        - $ref: '#/components/parameters/organizationMailboxMss'
        - $ref: '#/components/parameters/organizationType'
        - $ref: '#/components/parameters/lastUpdated'
        - $ref: '#/components/parameters/organizationAddress'
        - $ref: '#/components/parameters/organizationAddressCity'
        - $ref: '#/components/parameters/organizationAddressPostalCode'
        - $ref: '#/components/parameters/organizationDataInformationSystem'
        - $ref: '#/components/parameters/organizationPartOf'
        - $ref: '#/components/parameters/organizationPharmacyLicence'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/organizationInclude'
        - $ref: '#/components/parameters/organizationRevInclude'
      responses:
        '200':
          description: Bundle searchset contenant les `Organization` correspondantes
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
              examples:
                centreDeSante:
                  summary: "Cas d'usage — BAL MSS des centres de santé (secteur SA05)"
                  description: |
                    Réponse à
                    `GET /Organization?type=https://mos.esante.gouv.fr/NOS/TRE_R02-SecteurActivite/FHIR/TRE-R02-SecteurActivite|SA05`
                    `&mailbox-mss:contains=%40`
                  value:
                    resourceType: Bundle
                    type: searchset
                    total: 1
                    entry:
                      - fullUrl: "https://gateway.api.esante.gouv.fr/fhir/v2/Organization/organization-example-1"
                        resource:
                          resourceType: Organization
                          id: organization-example-1
                          identifier:
                            - system: https://finess.esante.gouv.fr
                              value: "750000123"
                          active: true
                          type:
                            - coding:
                                - system: https://mos.esante.gouv.fr/NOS/TRE_R02-SecteurActivite/FHIR/TRE-R02-SecteurActivite
                                  code: SA05
                                  display: Centre de santé
                          name: Centre de santé Saint-Michel
                          telecom:
                            - system: email
                              value: contact@centre-saint-michel.mssante.fr
                              rank: 1
                              extension:
                                - url: https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-ext-mailbox-mss-metadata
                                  extension:
                                    - url: type
                                      valueCodeableConcept:
                                        coding:
                                          - system: https://mos.esante.gouv.fr/NOS/TRE_R256-TypeMessagerie/FHIR/TRE-R256-TypeMessagerie
                                            code: ORG
                                    - url: description
                                      valueString: BAL principale de la structure
                          address:
                            - line: [ "12 rue de la Santé" ]
                              city: Paris
                              postalCode: "75013"
                              country: FR
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /Organization/{id}:
    get:
      tags: [ Organization ]
      summary: Lire une structure par identifiant logique
      operationId: readOrganization
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Ressource `Organization` trouvée
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                organization:
                  $ref: '#/components/examples/OrganizationExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /HealthcareService:
    get:
      tags: [ HealthcareService ]
      summary: Rechercher des activités de soin ou équipements sociaux
      description: |
        Recherche de ressources `HealthcareService`, déclinées en deux profils :
        activité de soin (`as-dp-healthcareservice-healthcare-activity`) et équipement
        social (`as-dp-healthcareservice-social-equipment`), sélectionnables via
        `_profile`. Rattachées à une structure via `organization`.
      operationId: searchHealthcareService
      parameters:
        - $ref: '#/components/parameters/healthcareServiceProfile'
        - $ref: '#/components/parameters/searchId'
        - $ref: '#/components/parameters/lastUpdated'
        - $ref: '#/components/parameters/healthcareServiceIdentifier'
        - $ref: '#/components/parameters/healthcareServiceActive'
        - $ref: '#/components/parameters/healthcareServiceDataInformationSystem'
        - $ref: '#/components/parameters/healthcareServiceCharacteristic'
        - $ref: '#/components/parameters/healthcareServiceOrganization'
        - $ref: '#/components/parameters/healthcareServiceCategory'
        - $ref: '#/components/parameters/healthcareServiceType'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/healthcareServiceInclude'
      responses:
        '200':
          description: Bundle searchset contenant les `HealthcareService` correspondants
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
              example:
                resourceType: Bundle
                type: searchset
                total: 1
                entry:
                  - fullUrl: "https://gateway.api.esante.gouv.fr/fhir/v2/HealthcareService/hcs-example-1"
                    resource:
                      resourceType: HealthcareService
                      id: hcs-example-1
                      identifier:
                        - system: https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-ext-numeroarhgos
                          value: "750000123-ACT01"
                      active: true
                      providedBy:
                        reference: Organization/organization-example-1
                        display: Centre de santé Saint-Michel
                      type:
                        - coding:
                            - system: https://mos.esante.gouv.fr/NOS/TRE_R209-TypeActivite/FHIR/TRE-R209-TypeActivite
                              code: SM01
                              display: Médecine générale
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /HealthcareService/{id}:
    get:
      tags: [ HealthcareService ]
      summary: Lire une activité de soin ou un équipement social par identifiant logique
      operationId: readHealthcareService
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Ressource `HealthcareService` trouvée
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/HealthcareService'
              examples:
                healthcareService:
                  $ref: '#/components/examples/HealthcareServiceExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /Device:
    get:
      tags: [ Device ]
      summary: Rechercher des équipements matériels lourds
      description: |
        Recherche de ressources `Device` (données complémentaires FINESS relatives aux
        équipements matériels lourds : scanners, IRM, etc.), rattachées à une structure
        via `organization`.
      operationId: searchDevice
      parameters:
        - $ref: '#/components/parameters/searchId'
        - $ref: '#/components/parameters/lastUpdated'
        - $ref: '#/components/parameters/deviceIdentifier'
        - $ref: '#/components/parameters/deviceStatus'
        - $ref: '#/components/parameters/deviceDataInformationSystem'
        - $ref: '#/components/parameters/deviceManufacturer'
        - $ref: '#/components/parameters/deviceModel'
        - $ref: '#/components/parameters/deviceOrganization'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/deviceInclude'
      responses:
        '200':
          description: Bundle searchset contenant les `Device` correspondants
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
              example:
                resourceType: Bundle
                type: searchset
                total: 1
                entry:
                  - fullUrl: "https://gateway.api.esante.gouv.fr/fhir/v2/Device/device-example-1"
                    resource:
                      resourceType: Device
                      id: device-example-1
                      identifier:
                        - system: https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-ext-numeroarhgos
                          value: "32-31-1156"
                      status: active
                      manufacturer: GE Healthcare
                      modelNumber: Revolution CT
                      type:
                        coding:
                          - system: https://mos.esante.gouv.fr/NOS/TRE_R272-EquipementMaterielLourd/FHIR/TRE-R272-EquipementMaterielLourd
                            code: "05602"
                            display: Scanographe
                      owner:
                        reference: Organization/organization-example-1
                        display: Centre de santé Saint-Michel
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /Device/{id}:
    get:
      tags: [ Device ]
      summary: Lire un équipement matériel lourd par identifiant logique
      operationId: readDevice
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Ressource `Device` trouvée
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                device:
                  $ref: '#/components/examples/DeviceExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:

    resourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identifiant logique (technique) de la ressource FHIR.

    searchId:
      name: _id
      in: query
      required: false
      schema:
        type: string
      description: Recherche sur l'identifiant technique de la ressource.

    lastUpdated:
      name: _lastUpdated
      in: query
      required: false
      schema:
        type: string
      description: |
        Filtre sur la date de dernière modification. Opérateurs supportés (préfixés à la
        date) : `eq`, `ne`, `gt`, `lt`, `ge`, `le`, `ap`.
        Pour les appels delta, l'historique n'est conservé que sur **30 jours glissants**.
        Exemple : `ge2025-09-27`.

    count:
      name: _count
      in: query
      required: false
      schema:
        type: integer
        default: 50
      description: Nombre maximum de résultats par page (50 par défaut).

    practitionerActive:
      name: active
      in: query
      required: false
      schema:
        type: boolean
      description: Statut d'exercice du professionnel (ouvert/fermé).

    practitionerDataInformationSystem:
      name: data-information-system
      in: query
      required: false
      schema:
        type: string
      description: Filtre sur le système d'information source de la donnée.

    practitionerFamily:
      name: family
      in: query
      required: false
      schema:
        type: string
      description: Nom d'exercice du professionnel.

    practitionerGiven:
      name: given
      in: query
      required: false
      schema:
        type: string
      description: Prénom d'exercice du professionnel.

    practitionerIdentifier:
      name: identifier
      in: query
      required: false
      schema:
        type: string
      description: |
        Identifiant métier du professionnel (RPPS, IdNatPP). Format `système|valeur`.
        Systèmes usuels :
        - `https://rpps.esante.gouv.fr|{NUM_RPPS}`
        - `urn:oid:1.2.250.1.71.4.2.1|{IDNAT_PP}`

        Exemple : `https://rpps.esante.gouv.fr|10001234567`.

    practitionerIdentifierType:
      name: identifier-type
      in: query
      required: false
      schema:
        type: string
        enum: [ RPPS, IDNPS ]
      description: Type de l'identifiant métier recherché (`RPPS` ou `IDNPS`).

    practitionerMailboxMss:
      name: mailbox-mss
      in: query
      required: false
      schema:
        type: string
      description: |
        Recherche sur une adresse de messagerie sécurisée de santé (BAL MSSanté PER ou
        CAB). Modificateur recommandé : `mailbox-mss:contains=...` (ex. `:contains=%40`
        pour toute BAL renseignée, `:contains=@medecin.mssante.fr` pour un domaine donné).

    practitionerName:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: Nom complet, avec civilité d'exercice.

    practitionerNumberSmartcard:
      name: number-smartcard
      in: query
      required: false
      schema:
        type: string
      description: Numéro de carte professionnelle (CPS).

    practitionerQualificationCode:
      name: qualification-code
      in: query
      required: false
      schema:
        type: string
      description: |
        Code de qualification (profession, diplôme, compétence). Exemple : `10` pour la
        profession « Médecin » dans la nomenclature NOS des professions.

    practitionerRevInclude:
      name: _revinclude
      in: query
      required: false
      schema:
        type: string
        enum:
          - "PractitionerRole:practitioner"
      description: |
        Inclut dans la réponse les `PractitionerRole` référençant le(s) `Practitioner`
        trouvé(s), pour reconstituer les situations d'exercice associées.

    practitionerRoleActive:
      name: active
      in: query
      required: false
      schema:
        type: boolean
      description: Statut d'activité de la situation d'exercice.

    practitionerRoleDataInformationSystem:
      name: data-information-system
      in: query
      required: false
      schema:
        type: string
        enum: [ RPPS, FINESS, MSS, CG ]
      description: Système d'information source de la donnée.

    practitionerRoleDataRegistrationAuthority:
      name: data-registration-authority
      in: query
      required: false
      schema:
        type: string
      description: Autorité d'enregistrement de la donnée.

    practitionerRoleIdentifier:
      name: identifier
      in: query
      required: false
      schema:
        type: string
      description: Identifiant métier de la situation d'exercice.

    practitionerRoleMailboxMss:
      name: mailbox-mss
      in: query
      required: false
      schema:
        type: string
      description: |
        Recherche sur une BAL MSSanté de type PER rattachée à un couple RPPS + structure.
        Modificateur recommandé : `:contains`. Exemple : `@medecin.mssante.fr`.

    practitionerRoleOrganization:
      name: organization
      in: query
      required: false
      schema:
        type: string
      description: Référence (identifiant technique) de l'`Organization` associée.

    practitionerRolePractitioner:
      name: practitioner
      in: query
      required: false
      schema:
        type: string
      description: Référence (identifiant technique) du `Practitioner` associé.

    practitionerRoleRole:
      name: role
      in: query
      required: false
      schema:
        type: string
      description: |
        Fonction, rôle de prise en charge ou mode d'exercice. Systèmes de nomenclature
        NOS usuels : `TRE_R21-Fonction`, `TRE_R85-RolePriseCharge`,
        `TRE_R96-AutreFonctionSanitaire`, `TRE_R22-GenreActivite`, `TRE_R23-ModeExercice`,
        `TRE_R06-SectionTableauCNOP`, `TRE_G05-SousSectionTableauCNOP`.

    practitionerRoleInclude:
      name: _include
      in: query
      required: false
      schema:
        type: string
        enum:
          - "PractitionerRole:organization"
          - "PractitionerRole:practitioner"
          - "PractitionerRole:*"
      description: Inclut dans la réponse l'`Organization` et/ou le `Practitioner` référencés.

    organizationActive:
      name: active
      in: query
      required: false
      schema:
        type: boolean
      description: Statut d'activité de la structure.

    organizationAddress:
      name: address
      in: query
      required: false
      schema:
        type: string
      description: Recherche libre sur l'adresse complète.

    organizationAddressCity:
      name: address-city
      in: query
      required: false
      schema:
        type: string
      description: Commune de la structure.

    organizationAddressPostalCode:
      name: address-postalcode
      in: query
      required: false
      schema:
        type: string
      description: Code postal de la structure.

    organizationDataInformationSystem:
      name: data-information-system
      in: query
      required: false
      schema:
        type: string
        enum: [ RPPS, FINESS ]
      description: Système d'information source de la donnée.

    organizationIdentifier:
      name: identifier
      in: query
      required: false
      schema:
        type: string
      description: |
        Identifiant de la structure (FINESS, SIREN, SIRET). Format `système|valeur`.
        Systèmes usuels :
        - `https://finess.esante.gouv.fr|{NUM_FINESS}`
        - `https://sirene.fr|{NUM_SIREN}` ou `{NUM_SIRET}`

        Exemple : `https://finess.esante.gouv.fr|123456789`.

    organizationIdentifierType:
      name: identifier-type
      in: query
      required: false
      schema:
        type: string
      description: Type de l'identifiant métier recherché.

    organizationMailboxMss:
      name: mailbox-mss
      in: query
      required: false
      schema:
        type: string
      description: |
        Recherche sur une BAL MSSanté organisationnelle (`ORG`) ou applicative (`APP`).
        Modificateur recommandé : `:contains` (ex. `:contains=%40` pour toute BAL
        renseignée).

    organizationName:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: Raison sociale ou dénomination commerciale de la structure.

    organizationPartOf:
      name: partof
      in: query
      required: false
      schema:
        type: string
      description: Référence de l'entité légale ou de rattachement parente.

    organizationPharmacyLicence:
      name: pharmacy-licence
      in: query
      required: false
      schema:
        type: string
      description: Numéro de licence d'officine (pharmacies).

    organizationType:
      name: type
      in: query
      required: false
      schema:
        type: string
      description: |
        Type de structure (entité géographique/légale), code APE/NAF, catégorie juridique,
        secteur d'activité, catégorie d'établissement, code ESPIC…). Format `système|code`.
        Exemple : `https://mos.esante.gouv.fr/NOS/TRE_R02-SecteurActivite/FHIR/TRE-R02-SecteurActivite|SA05`
        pour le secteur d'activité `SA05` (centres de santé).

    organizationInclude:
      name: _include
      in: query
      required: false
      schema:
        type: string
        enum:
          - "Organization:partof"
          - "Organization:*"
      description: Inclut dans la réponse l'entité de rattachement référencée par `partof`.

    organizationRevInclude:
      name: _revinclude
      in: query
      required: false
      schema:
        type: string
        enum:
          - "Device:organization"
          - "HealthcareService:organization"
          - "PractitionerRole:organization"
      description: |
        Inclut dans la réponse les ressources référençant la structure trouvée
        (`Device`, `HealthcareService`, `PractitionerRole`).

    healthcareServiceActive:
      name: active
      in: query
      required: false
      schema:
        type: boolean
      description: Statut d'activité de l'activité de soin ou de l'équipement social.

    healthcareServiceProfile:
      name: _profile
      in: query
      required: false
      schema:
        type: string
        enum:
          - "https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-dp-healthcareservice-healthcare-activity"
          - "https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-dp-healthcareservice-social-equipment"
      description: Sélectionne le profil de la ressource (activité de soin vs équipement social).

    healthcareServiceDataInformationSystem:
      name: as-sp-data-information-system
      in: query
      required: false
      schema:
        type: string
      description: Système d'information source de la donnée.

    healthcareServiceCharacteristic:
      name: characteristic
      in: query
      required: false
      schema:
        type: string
      description: |
        Forme ou type d'activité. Format `système|code`.
        Exemple : `https://mos.esante.gouv.fr/NOS/TRE_R276-FormeActivite/FHIR/TRE-R276-FormeActivite|SM`.

    healthcareServiceIdentifier:
      name: identifier
      in: query
      required: false
      schema:
        type: string
      description: Identifiant ARHGOS de l'équipement social ou de l'activité de soin.

    healthcareServiceOrganization:
      name: organization
      in: query
      required: false
      schema:
        type: string
      description: Référence de la structure porteuse de l'activité/équipement.

    healthcareServiceCategory:
      name: service-category
      in: query
      required: false
      schema:
        type: string
      description: Modalité de l'activité de soin.

    healthcareServiceType:
      name: service-type
      in: query
      required: false
      schema:
        type: string
      description: |
        Discipline de l'équipement social ou activité de soin réglementée. Format
        `système|code` (nomenclature `TRE_R209-TypeActivite`).
        Exemple : `https://mos.esante.gouv.fr/NOS/TRE_R209-TypeActivite/FHIR/TRE-R209-TypeActivite|SM01`.

    healthcareServiceInclude:
      name: _include
      in: query
      required: false
      schema:
        type: string
        enum:
          - "HealthcareService:organization"
      description: Inclut dans la réponse l'`Organization` référencée.

    deviceDataInformationSystem:
      name: data-information-system
      in: query
      required: false
      schema:
        type: string
      description: Système d'information source de la donnée.

    deviceIdentifier:
      name: identifier
      in: query
      required: false
      schema:
        type: string
      description: |
        Numéro(s) d'équipement ARHGOS. Recherche multi-valeurs possible via une liste
        séparée par des virgules.
        Exemple : `32-31-1156,93-93-4364`.

    deviceManufacturer:
      name: manufacturer
      in: query
      required: false
      schema:
        type: string
      description: Marque de l'équipement.

    deviceModel:
      name: model
      in: query
      required: false
      schema:
        type: string
      description: Modèle de l'équipement.

    deviceOrganization:
      name: organization
      in: query
      required: false
      schema:
        type: string
      description: Référence de la structure porteuse de l'équipement.

    deviceStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [ active, inactive, entered-in-error, unknown ]
      description: Statut de l'équipement matériel lourd.

    deviceType:
      name: type
      in: query
      required: false
      schema:
        type: string
      description: |
        Type d'équipement matériel lourd (nomenclature `TRE_R272-EquipementMaterielLourd`).
        Exemple : code `05602` pour un scanner. Format `système|code`.

    deviceInclude:
      name: _include
      in: query
      required: false
      schema:
        type: string
        enum:
          - "Device:organization"
          - "Device:*"
      description: Inclut dans la réponse l'`Organization` référencée.

  schemas:

    Coding:
      type: object
      properties:
        system:
          type: string
        code:
          type: string
        display:
          type: string

    CodeableConcept:
      type: object
      properties:
        coding:
          type: array
          items:
            $ref: '#/components/schemas/Coding'
        text:
          type: string

    Identifier:
      type: object
      properties:
        system:
          type: string
        value:
          type: string
        type:
          $ref: '#/components/schemas/CodeableConcept'

    Reference:
      type: object
      properties:
        reference:
          type: string
          description: "Référence relative, ex. `Organization/organization-example-1`."
        type:
          type: string
        identifier:
          $ref: '#/components/schemas/Identifier'
        display:
          type: string

    HumanName:
      type: object
      properties:
        use:
          type: string
          enum: [ usual, official, nickname ]
        text:
          type: string
        family:
          type: string
        given:
          type: array
          items:
            type: string
        prefix:
          type: array
          items:
            type: string

    Address:
      type: object
      properties:
        use:
          type: string
        line:
          type: array
          items:
            type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string

    MailboxMssMetadataExtension:
      type: object
      description: Extension `as-ext-mailbox-mss-metadata` portée par un `telecom` de type BAL MSSanté.
      properties:
        url:
          type: string
          enum: [ https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-ext-mailbox-mss-metadata ]
        extension:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                enum: [ type, listeRouge, description, service, responsible ]
              valueCodeableConcept:
                $ref: '#/components/schemas/CodeableConcept'
              valueBoolean:
                type: boolean
              valueString:
                type: string

    ContactPoint:
      type: object
      properties:
        system:
          type: string
          enum: [ phone, fax, email, url ]
        value:
          type: string
        use:
          type: string
        rank:
          type: integer
          minimum: 1
          description: Ordre de préférence (1 = priorité la plus haute).
        extension:
          type: array
          items:
            $ref: '#/components/schemas/MailboxMssMetadataExtension'

    Meta:
      type: object
      properties:
        versionId:
          type: string
        lastUpdated:
          type: string
          format: date-time
        profile:
          type: array
          items:
            type: string

    Practitioner:
      type: object
      description: Ressource FHIR `Practitioner` (profil `as-dp-practitioner`) — professionnel de santé.
      properties:
        resourceType:
          type: string
          enum: [ Practitioner ]
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          description: Identifiants RPPS / IdNatPP.
        active:
          type: boolean
        name:
          type: array
          items:
            $ref: '#/components/schemas/HumanName'
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
          description: Coordonnées, dont BAL MSSanté PER/CAB.
        address:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        qualification:
          type: array
          items:
            type: object
            properties:
              identifier:
                type: array
                items:
                  $ref: '#/components/schemas/Identifier'
              code:
                allOf:
                  - $ref: '#/components/schemas/CodeableConcept'
                description: Profession, diplôme, compétence (`qualification-code`).
              issuer:
                $ref: '#/components/schemas/Reference'

    PractitionerRole:
      type: object
      description: Ressource FHIR `PractitionerRole` (profil `as-dp-practitionerrole`) — situation d'exercice.
      properties:
        resourceType:
          type: string
          enum: [ PractitionerRole ]
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        active:
          type: boolean
        practitioner:
          $ref: '#/components/schemas/Reference'
        organization:
          $ref: '#/components/schemas/Reference'
        code:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: Fonction, rôle de prise en charge, mode d'exercice, genre d'activité.
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
          description: Coordonnées, dont BAL MSSanté PER.

    Organization:
      type: object
      description: Ressource FHIR `Organization` (profil `as-dp-organization`) — structure.
      properties:
        resourceType:
          type: string
          enum: [ Organization ]
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          description: Identifiants FINESS / SIREN / SIRET.
        active:
          type: boolean
        type:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: Type d'entité (géographique/légale), catégorie juridique, secteur d'activité…
        name:
          type: string
        alias:
          type: array
          items:
            type: string
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
          description: Coordonnées, dont BAL MSSanté ORG/APP.
        address:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        partOf:
          $ref: '#/components/schemas/Reference'

    HealthcareService:
      type: object
      description: |
        Ressource FHIR `HealthcareService` — activité de soin
        (`as-dp-healthcareservice-healthcare-activity`) ou équipement social
        (`as-dp-healthcareservice-social-equipment`).
      properties:
        resourceType:
          type: string
          enum: [ HealthcareService ]
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          description: Identifiant ARHGOS.
        active:
          type: boolean
        providedBy:
          allOf:
            - $ref: '#/components/schemas/Reference'
          description: Structure porteuse (`organization`).
        type:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: Discipline / type réglementé (`service-type`).
        category:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: Modalité (`service-category`).
        characteristic:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: Forme d'activité.

    Device:
      type: object
      description: Ressource FHIR `Device` (profil `as-dp-device`) — équipement matériel lourd.
      properties:
        resourceType:
          type: string
          enum: [ Device ]
        id:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          description: Numéro(s) ARHGOS.
        status:
          type: string
          enum: [ active, inactive, entered-in-error, unknown ]
        manufacturer:
          type: string
        modelNumber:
          type: string
        type:
          allOf:
            - $ref: '#/components/schemas/CodeableConcept'
          description: Type d'équipement matériel lourd (`TRE_R272-EquipementMaterielLourd`).
        owner:
          allOf:
            - $ref: '#/components/schemas/Reference'
          description: Structure porteuse (`organization`).

    Bundle:
      type: object
      description: Bundle FHIR de type `searchset`.
      properties:
        resourceType:
          type: string
          enum: [ Bundle ]
        type:
          type: string
          enum: [ searchset ]
        total:
          type: integer
        link:
          type: array
          items:
            type: object
            properties:
              relation:
                type: string
                enum: [ self, next, previous ]
              url:
                type: string
        entry:
          type: array
          items:
            type: object
            properties:
              fullUrl:
                type: string
              search:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [ match, include ]
              resource:
                type: object
                description: >
                  Ressource FHIR (`Practitioner`, `PractitionerRole`, `Organization`,
                  `HealthcareService` ou `Device` selon la recherche et les
                  `_include`/`_revinclude` demandés).

    OperationOutcome:
      type: object
      properties:
        resourceType:
          type: string
          enum: [ OperationOutcome ]
        issue:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [ error, warning, information ]
              code:
                type: string
              details:
                type: object
                properties:
                  text:
                    type: string

  examples:

    PractitionerExample:
      summary: Praticien avec BAL MSS personnelle
      value:
        resourceType: Practitioner
        id: practitioner-dupont
        meta:
          profile:
            - https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-dp-practitioner
        identifier:
          - system: https://rpps.esante.gouv.fr
            value: "10001234567"
        active: true
        name:
          - family: DUPONT
            given: [ Jean ]
            prefix: [ Dr ]
        telecom:
          - system: email
            value: jean.dupont@medecin.mssante.fr
            rank: 1
            extension:
              - url: https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-ext-mailbox-mss-metadata
                extension:
                  - url: type
                    valueCodeableConcept:
                      coding:
                        - system: https://mos.esante.gouv.fr/NOS/TRE_R256-TypeMessagerie/FHIR/TRE-R256-TypeMessagerie
                          code: PER
                  - url: listeRouge
                    valueBoolean: false
        qualification:
          - code:
              coding:
                - system: https://mos.esante.gouv.fr/NOS/TRE_G15-ProfessionSante/FHIR/TRE-G15-ProfessionSante
                  code: "10"
                  display: Médecin

    PractitionerRoleExample:
      summary: Situation d'exercice avec BAL MSS PER (RPPS + structure)
      value:
        resourceType: PractitionerRole
        id: role-example-1
        identifier:
          - system: https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-ext-numeroautorisationpersonnesactivite
            value: "800012345-1"
