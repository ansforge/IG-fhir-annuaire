      operationId: readPractitionerRole
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Ressource `PractitionerRole` trouvée
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/PractitionerRole'
