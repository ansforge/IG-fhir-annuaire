  /PractitionerRole:
    get:
      tags: [ PractitionerRole ]
      summary: Rechercher des situations d'exercice
      description: |
        Recherche de ressources `PractitionerRole`, reliant un `Practitioner` à une
        `Organization`. Permet de reconstituer le contexte d'exercice (rôle, mode
        d'exercice).
      operationId: searchPractitionerRole
      parameters:
        - $ref: '#/components/parameters/searchId'
        - $ref: '#/components/parameters/practitionerRoleIdentifier'
        - $ref: '#/components/parameters/lastUpdated'
        - $ref: '#/components/parameters/practitionerRoleActive'
        - $ref: '#/components/parameters/practitionerRoleRole'
        - $ref: '#/components/parameters/practitionerRoleDataInformationSystem'
        - $ref: '#/components/parameters/practitionerRoleDataRegistrationAuthority'
        - $ref: '#/components/parameters/practitionerRoleMailboxMss'
        - $ref: '#/components/parameters/practitionerRoleOrganization'
        - $ref: '#/components/parameters/practitionerRolePractitioner'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/practitionerRoleInclude'
      responses:
        '200':
          description: Bundle searchset contenant les `PractitionerRole` correspondants
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
              examples:
                balMssPer:
                  summary: "Cas d'usage — BAL MSS PER (RPPS + structure)"
                  description: Réponse à `GET /PractitionerRole?mailbox-mss:contains=%40`
                  value:
                    resourceType: Bundle
                    type: searchset
                    total: 1
                    entry:
                      - fullUrl: "https://gateway.api.esante.gouv.fr/fhir/v2/PractitionerRole/role-example-1"
                        resource:
                          resourceType: PractitionerRole
                          id: role-example-1
                          active: true
                          practitioner:
                            reference: Practitioner/practitioner-dupont
                            display: Dr Jean DUPONT
                          organization:
                            reference: Organization/organization-example-1
                            display: Centre de santé Saint-Michel
                          code:
                            - coding:
                                - system: https://mos.esante.gouv.fr/NOS/TRE_R21-Fonction/FHIR/TRE-R21-Fonction
                                  code: "10"
                                  display: Médecin
                          telecom:
                            - system: email
                              value: jean.dupont@centre-saint-michel.mssante.fr
                              rank: 1
                              extension:
                                - url: https://interop.esante.gouv.fr/ig/fhir/annuaire/StructureDefinition/as-ext-mailbox-mss-metadata
                                  extension:
                                    - url: type
                                      valueCodeableConcept:
                                        coding:
                                          - system: https://mos.esante.gouv.fr/NOS/TRE_R256-TypeMessagerie/FHIR/TRE-R256-TypeMessagerie
                                            code: PER
        '400':
          $ref: '#/components/responses/BadRequest'
