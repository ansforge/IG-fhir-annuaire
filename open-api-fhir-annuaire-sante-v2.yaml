        - $ref: '#/components/parameters/practitionerGiven'
        - $ref: '#/components/parameters/practitionerName'
        - $ref: '#/components/parameters/practitionerDataInformationSystem'
        - $ref: '#/components/parameters/practitionerMailboxMss'
        - $ref: '#/components/parameters/practitionerNumberSmartcard'
        - $ref: '#/components/parameters/practitionerQualificationCode'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/practitionerRevInclude'
