        '200':
          description: Bundle searchset contenant les `Practitioner` correspondants
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
              examples:
                appelComplet:
                  summary: "Cas d'usage — appel complet (médecins actifs)"
                  description: Réponse paginée à `GET /Practitioner?qualification-code=10&active=true`
