openapi: 3.0.3

info:
  title: API FHIR Annuaire Santé — v2
  version: "2.0"
  description: |
    Spécification OpenAPI de l'**API FHIR Annuaire Santé** exposée par
    l'Agence du Numérique en Santé (ANS), couvrant exclusivement la **version 2** de l'API.

    Cette spécification décrit les interactions de **recherche** (`search-type`) et de
    **lecture** (`read`) sur les cinq ressources FHIR R4 publiées par l'Annuaire Santé :

    | Ressource | Contenu |
    |-----------|---------|
    | `Practitioner` | Professionnels de santé (identité, RPPS, qualifications) |
    | `PractitionerRole` | Situations d'exercice (lien professionnel ↔ structure, rôle, mode d'exercice) |
    | `Organization` | Structures (établissements, cabinets, entités juridiques /géographiques) |
    | `HealthcareService` | Activités de soin et équipements sociaux rattachés à une structure |
    | `Device` | Équipements matériels lourds (scanners, IRM, etc.) |

    **Documentation source** : https://ansforge.github.io/annuaire-sante-fhir-documentation/pages/guide/version-2/getting-started/introduction.html

    **Guide d'implémentation API FHIR Annuaire Santé** : https://interop.esante.gouv.fr/ig/fhir/annuaire/

    **Serveur FHIR** : https://github.com/ansforge/annuaire-sante-fhir-serveur

    **Démonstrateur** : https://portail.openfhir.annuaire.sante

    ## Authentification

    Toutes les requêtes doivent porter l'en-tête `ESANTE-API-KEY` avec une clé d'API délivrée
    par un outil de gestion des API (inscription sur le portail Gravitee https://portal.api.esante.gouv.fr/).

    ## Limites techniques

    - **Timeout** : le délai de réponse par défaut est de **30 secondes**. Au-delà, la
      requête est interrompue par la passerelle API ; adapter le paramètre `_count` ou les
      critères de recherche si ce délai est régulièrement atteint.
    - **Débit (rate limiting)** : chaque application enregistrée sur la passerelle Gravitee
      est limitée à **17 appels par seconde par application Gravitee**. Au-delà, la passerelle renvoie une erreur de
      dépassement de quota ; il est recommandé de lisser les appels côté client (files
      d'attente, retry avec backoff) plutôt que d'ouvrir plusieurs applications pour
      contourner cette limite.

    ## Format des échanges

    Les réponses sont au format `application/fhir+json`. Les résultats de recherche sont
    encapsulés dans un `Bundle` de type `searchset`, paginé via les liens `self` / `next`
    (`relation` dans `Bundle.link`).

    ## Remarque sur la fidélité du modèle

    Les schémas de ce document sont des **représentations simplifiées** des profils FHIR
    officiels (`as-dp-*`), suffisantes pour piloter un client HTTP/Swagger. Pour la validation
    normative des ressources, se référer aux `StructureDefinition` du guide d'implémentation.

  contact:
    name: ANS — Agence du Numérique en Santé
    url: https://esante.gouv.fr

servers:
  - url: https://gateway.api.esante.gouv.fr/fhir/v2
    description: API FHIR Annuaire Santé — v2 (production)

tags:
  - name: Practitioner
    description: Correspond à l'ensemble des exercices professionnels d'un professionnel.
  - name: PractitionerRole
    description: Correspond à l'ensemble des situations d'exercices d'un professionnel.
  - name: Organization
    description: Correspond à l'ensemble des structures géographiques et juridiques.
  - name: HealthcareService
    description: Correspond à l'ensemble activités de soins et équipements sociaux.
  - name: Device
    description: Correspond aux Equipements Matériels Lourds (scanners, IRM…)

